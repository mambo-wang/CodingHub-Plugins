name: tdd-with-execute-plan-speckit-like
version: 2
description: 原子化TDD工作流，子代理隔离执行，证据驱动验证

artifacts:
  - id: proposal
    generates: proposal.md
    description: 变更提案——为什么做、期望什么行为
    template: proposal.md
    instruction: |
      创建一份变更提案，说明为什么要做这个改动。
      必须用WHEN/THEN格式列出每一个可测试行为：
      - WHEN <函数名>(<输入>) 被调用 THEN 结果为 <期望值>
      只描述"期望发生什么"，不要描述实现细节。
    requires: []

  - id: specs
    generates: specs/**/*.md
    description: 行为规格——用场景描述期望行为
    template: spec.md
    instruction: |
      用 GIVEN/WHEN/THEN 格式编写行为规格：
      - 每个场景必须可独立测试
      - 覆盖：正常路径、边界情况、错误处理
      - 只描述期望行为，不描述实现方式
    requires:
      - proposal

  - id: design
    generates: design.md
    description: 技术设计——怎么实现、测试策略
    template: design.md
    instruction: |
      编写技术设计方案，说明如何实现。
      必须包含：
      - 要创建的文件列表（测试文件+源码文件，给出完整路径）
      - 每个测试文件的测试策略（单元测试/集成测试）
      - 源码文件与测试文件的对应关系
      - 测试运行命令
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: 原子化TDD任务列表
    template: tasks.md
    instruction: |
      关键要求：将工作拆分为原子化 TDD 任务。
      每个任务必须是且仅是一个 TDD 阶段（RED / GREEN / REFACTOR）。
      必须使用checkbox格式书写每个任务：
      ### Feature: [功能名称]
      - [ ] RED: 编写失败测试——[测试什么行为]
      - [ ] GREEN: 最小实现——[实现描述，引用对应的RED任务]
      - [ ] REFACTOR: 重构清理——[清理描述]（可选）
      规则：
      1. 禁止将RED和GREEN合并到一个任务
      2. 每个GREEN任务必须引用对应的RED测试
      3. 每个任务必须使用"- [ ]" checkbox格式
      4. 任务严格交替：RED→GREEN→（可选REFACTOR）
      5. 每个任务应在2-5分钟内可完成
    requires:
      - specs
      - design

  - id: api-contracts
    generates: api-contracts.md
    description: API接口契约——对外API接口描述、入参返回值字段定义与示例
    template: api-contracts.md
    instruction: |
      编写API接口契约文档，描述所有对外暴露的API接口。
      每个接口必须包含：
      - HTTP方法和路径
      - 接口描述
      - 认证要求（公开/需认证）
      - 请求参数（路径参数、查询参数、请求体），包含字段名、类型、是否必填、默认值、描述
      - 请求体示例（JSON格式）
      - 输入校验规则
      - 成功响应（状态码、响应体字段定义、示例JSON）
      - 错误响应（状态码、错误描述）
      - 通用响应结构说明
      - 通用错误码定义
      规则：
      1. 所有接口必须遵循统一的响应信封格式
      2. 字段类型必须明确（string/long/int/boolean等）
      3. 每个接口必须提供完整的请求和响应示例
      4. 分页接口必须说明分页参数和响应结构
      5. 需要认证的接口必须标注Authorization Header要求
    requires:
      - specs
      - design

  - id: ui-preview
    generates: ui-preview.html
    description: UI预览——基于设计规范生成可预览的HTML原型
    instruction: |
      使用 ui-ux-pro-max skill 生成本次变更涉及的 UI 改动预览 HTML。
      输入要求：
      - 分析 specs/**/*.md 中的行为规格，理解功能需求
      - 分析 design.md 中的技术设计，了解涉及的前端文件
      - 参考项目 UI 规范（Element Plus 组件库风格）
      - 参考现有前端代码实现模式
      输出要求：
      - 生成独立的 HTML 文件，可在浏览器中直接预览
      - 包含所有新增/修改的页面和组件
      - 模拟真实数据展示
      - 响应式布局适配
      规则：
      1. 使用 Element Plus 组件风格，保持与现有项目一致
      2. HTML 文件需内联 CSS 和 JavaScript（无外部依赖）
      3. 模拟后端接口返回的数据结构
      4. 包含必要的交互状态（加载中、成功、错误、空数据）
      5. 文件命名规范：ui-preview-{功能模块}.html
    requires:
      - specs
      - design

  - id: manual-test-cases
    generates: manual-test-cases.md
    description: 手工测试用例——基于UI页面的功能/可靠性/兼容性/易用性测试
    template: manual-test-cases.md
    instruction: |
      基于 UI 预览和规格说明，生成面向页面操作的手工测试用例。
      输入要求：
      - 分析 ui-preview.html 中的 UI 布局和交互元素
      - 分析 specs/**/*.md 中的行为规格，理解功能流程
      - 参考现有前端代码实现（uco-linseer-ai-ui、ucm-linseer-ai-ui）
      - 了解项目 UI 组件库（Element Plus）和交互模式
      测试用例要求：
      - 每个用例必须基于用户视角，描述页面操作步骤
      - 不是测试后端 API，而是测试前端页面的功能
      - 覆盖正向路径、异常路径、边界条件
      表格格式（必须包含）：
      - 测试用例名称：简洁明确的功能描述
      - 测试类型：功能测试 / 可靠性测试 / 兼容性测试 / 易用性测试
      - 测试步骤描述：详细的前置条件、操作步骤（点击按钮、输入框操作等）
      - 预期结果：操作后页面应产生的正确行为
      规则：
      1. 测试用例必须覆盖页面加载、表单操作、数据展示、状态切换等核心场景
      2. 每个测试步骤必须可重复执行，描述具体操作而非接口调用
      3. 预期结果必须可验证（如：页面显示xxx、数据加载成功、提示信息正确）
      4. 测试类型分类清晰，便于测试计划执行
      5. 包含必要的异常场景（网络错误、空数据、权限不足等）
      6. 覆盖所有 UI 预览中的新增/修改组件
    requires:
      - ui-preview
      - specs