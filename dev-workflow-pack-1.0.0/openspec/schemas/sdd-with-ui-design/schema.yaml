name: spec-driven
version: 1
description: 默认 OpenSpec 工作流 - 提案 → 规格 → 设计 → 任务
artifacts:
  - id: proposal
    generates: proposal.md
    description: 初始提案文档，阐明变更的动机
    template: proposal.md
    instruction: |
      创建提案文档，说明为什么需要这次变更。

      章节：
      - **为什么（Why）**：1-2 句话说明问题或机会。解决什么问题？为什么现在做？
      - **变更内容（What Changes）**：变更事项的子弹列表。明确说明新增能力、修改或删除。破坏性变更用 **BREAKING** 标记。
      - **能力清单（Capabilities）**：识别需要创建或修改的规格文件：
        - **新增能力**：列出本次引入的新能力。每个新能力对应一个 `specs/<name>/spec.md`。使用 kebab-case 命名（如 `user-auth`、`data-export`）。
        - **修改能力**：列出需求（REQUIREMENTS）发生变化的现有能力。仅当规格级别的行为变化时才列入（不只是实现细节）。每个需要 delta 规格文件。检查 `openspec/specs/` 目录获取现有规格名称。如无需求变更则留空。
      - **影响范围（Impact）**：受影响的代码、API、依赖或系统。

      重要：能力清单章节至关重要。它建立了提案和规格阶段之间的契约。
      填写前请先调研现有规格。每个列出的能力都需要对应的规格文件。

      保持简洁（1-2 页）。聚焦于「为什么」而非「怎么做」——
      实现细节属于 design.md。

      这是基础——规格、设计和任务都建立在此之上。
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: 变更的详细规格说明
    template: spec.md
    instruction: |
      创建规格文件，定义系统应该做什么（WHAT）。

      为提案「能力清单」中列出的每个能力创建一个规格文件。
      - 新增能力：使用提案中完全一致的 kebab-case 名称（specs/<capability>/spec.md）。
      - 修改能力：创建 delta 规格时使用 openspec/specs/<capability>/ 中的现有规格目录名。

      Delta 操作（使用 ## 标题）：
      - **ADDED Requirements（新增需求）**：新能力
      - **MODIFIED Requirements（修改需求）**：行为变更——必须包含完整的更新内容
      - **REMOVED Requirements（移除需求）**：废弃功能——必须包含**原因（Reason）**和**迁移方案（Migration）**
      - **RENAMED Requirements（重命名需求）**：仅名称变更——使用 FROM:/TO: 格式

      格式要求：
      - 每个需求：`### Requirement: <名称>`，后跟描述
      - 使用 SHALL/MUST 表示规范性需求（避免 should/may）
      - 每个场景：`#### Scenario: <名称>`，使用 WHEN/THEN 格式
      - **重要**：场景必须使用恰好 4 个井号（`####`）。使用 3 个井号或子弹点会静默失败。
      - 每个需求必须至少有一个场景。

      修改需求工作流程：
      1. 在 openspec/specs/<capability>/spec.md 中找到现有需求
      2. 复制完整的需求块（从 `### Requirement:` 到所有场景）
      3. 粘贴到 `## MODIFIED Requirements` 下并编辑以反映新行为
      4. 确保标题文本完全匹配（不区分空格）

      常见陷阱：使用 MODIFIED 时只写部分内容会在归档时丢失细节。
      如果只是添加新关注点而不改变现有行为，请使用 ADDED。

      示例：
      ```
      ## ADDED Requirements

      ### Requirement: 用户可导出数据
      系统必须允许用户以 CSV 格式导出数据。

      #### Scenario: 成功导出
      - **WHEN** 用户点击「导出」按钮
      - **THEN** 系统下载包含所有用户数据的 CSV 文件

      ## REMOVED Requirements

      ### Requirement: 旧版导出
      **原因**：被新导出系统取代
      **迁移方案**：使用新的导出端点 /api/v2/export
      ```

      规格应当是可测试的——每个场景对应一个潜在的测试用例。
    requires:
      - proposal
      - design

  - id: design
    generates: design.md
    description: 技术设计文档，包含实现细节
    template: design.md
    instruction: |
      创建设计文档，说明如何实现变更（HOW）。

      何时需要 design.md（满足任一条件时创建）：
      - 横切多服务/模块的变更，或引入新架构模式
      - 新增外部依赖或重要的数据模型变更
      - 涉及安全、性能或迁移复杂度
      - 需要在编码前明确技术决策以消除歧义

      章节：
      - **背景（Context）**：背景、现状、约束、相关方
      - **目标 / 非目标（Goals / Non-Goals）**：本设计要达成什么，明确排除什么
      - **决策（Decisions）**：关键技术选型及理由（为何选 X 而非 Y？）。列出每个决策考虑过的备选方案。
      - **风险 / 权衡（Risks / Trade-offs）**：已知限制、可能出错的地方。格式：[风险] → 缓解措施
      - **迁移计划（Migration Plan）**：部署步骤、回滚策略（如适用）
      - **待定问题（Open Questions）**：待决策或未知事项

      聚焦架构和方法，而非逐行实现细节。
      引用提案了解动机，引用规格了解需求。

      好的设计文档解释技术决策背后的「为什么」。
    requires:
      - proposal


  - id: design-system
    generates: design-system.md
    description: |
      本次变更的 UI 约束摘要——引用全局设计系统，列出本次涉及的组件/样式/交互规范
      【可选 artifact】仅当改动涉及前端 UI 时生成；纯后端/逻辑变更可跳过
      【双主题固定配置】项目始终使用暗色 (dark) + 亮色 (light) 双主题，
      token 映射表必须并列两列（暗色 | 亮色 | CSS 变量），
      交互状态按组件分子节，每个组件下按暗色/亮色分两个子节
    template: design-system.md
    instruction: |
      【可选 artifact】仅当改动涉及前端界面修改时执行。

      ## 第一步：读取全局设计系统
      读取项目全局设计系统文件 `design-system/CodingHub/MASTER.md`，
      提取与本次变更相关的组件、样式、配色、字体、交互规范。

      ## 第二步：按需补充 ui-ux-pro-max 检索
      如全局设计系统未覆盖本次需要的 UI 模式，调用 ui-ux-pro-max 补充：
      ```bash
      python3 ~/.agents/skills/ui-ux-pro-max/scripts/search.py "<产品类型> <行业> <风格关键词>" --design-system -p "<项目名>" -f markdown
      ```

      ## 第三步：生成本次 UI 约束摘要
      基于 MASTER.md + 补充检索结果，生成本次变更的 UI 约束摘要（design-system.md）。

      必须包含的章节：
      1. **全局样式引用** — 字体、圆角、阴影（阴影表需暗色/亮色两列）
      2. **双主题 Tokens 映射** — 暗色主题 | 亮色主题 | CSS 变量 三列表，涵盖页面背景、面板、卡片、毛玻璃、主色、辅助色、文字色、边框色等全部角色
      3. **涉及组件清单** — 组件/页面、用途、状态覆盖
      4. **交互状态（双主题）** — 每个组件按暗色/亮色分别列出所有状态的完整样式（normal/hover/focus/disabled/loading/active）
      5. **响应式策略** — 断点与布局行为
      6. **可访问性要求** — checkbox 清单（暗色/亮色焦点环分别列出）
      7. **图标清单** — Lucide 图标及 aria 属性
      8. **Antipatterns 检查** — 合规/不合规项

      每个组件的暗色/亮色交互状态必须分别列出完整样式，确保每个主题可独立验证。

      如不需要生成 UI，此 artifact 可跳过。
    requires:
      - proposal

  - id: impact-analysis
    generates: impact-analysis.md
    description: |
      代码影响范围分析——基于 design.md 中的文件/类清单执行 codegraph 扫描
      【条件必选】仅当 design 涉及修改现有代码时执行；纯新增模块/页面可跳过
    template: impact-analysis.md
    instruction: |
      【条件必选 artifact】执行规则：
      1. 读取 design.md 中的文件列表、类列表、源码文件与测试文件对应关系
      2. 判定改动类型：
         - design.md 中所有源码文件均为新增 → 跳过此 artifact
         - design.md 中存在任意现有源码文件 → 必须执行
      3. 若需执行，使用 Task(code-explorer) 子代理扫描代码库：
         - 以 design.md 中列出的现有类/函数/组件/API 作为 codegraph 入口
         - 追踪直接调用方与传递调用方（深度 2-3 层）
         - 列出依赖的上游服务（repository、config、util）
         - 找出受影响的测试文件
         - 检查 design.md 的源码文件与测试文件对应关系是否完整
         - 评估改动风险等级（L0 纯新增 / L1 修改公共 API / L2 修改 schema 或业务规则）
         - 生成回归测试建议清单
      4. 校验后端层级依赖仍合法：
         ```bash
         bash scripts/lint-arch.sh
         ```
         若 FAIL 必须修复 design 后再继续
      5. 若发现 design.md 漏掉受影响文件/测试，必须在报告中列出“设计修正建议”
      6. 报告保存到 impact-analysis.md
    requires:
      - design

  - id: ui-preview
    generates: ui-preview.html
    description: |
      HTML 界面预览——基于 design-system 与 ui-ux-pro-max 设计规范生成可交互的 UI 原型
      【仅当改动涉及前端 UI 时生成】
      【双主题固定配置】在同一 HTML 文件中使用 CSS 变量 + [data-theme] 属性实现暗色/亮色双主题切换预览，
    template: ui-preview.md
    instruction: |
      【可选 artifact】仅当改动涉及前端界面修改时执行。

      使用 ui-ux-pro-max skill 获取设计规范与样式决策，然后生成 HTML 预览页面。
      目的：让用户直观预览最终效果，作为视觉验收标准。

      ## 第一步：确认设计依据
      优先读取本次变更生成的 design-system.md；如未生成，则读取全局 `design-system/CodingHub/MASTER.md`。
      如设计依据仍不足，可调用 ui-ux-pro-max 检索样式、配色、字体、UX 规则：
      ```bash
      python3 ~/.agents/skills/ui-ux-pro-max/scripts/search.py "<产品类型> <行业> <风格关键词>" --design-system -p "<项目名>" -f markdown
      ```

      ## 第二步：生成 HTML 预览
      基于 design.md 和 design-system.md 生成代码。参考 `openspec/changes/add-post-delete/ui-preview.html` 的结构。

      双主题 CSS 变量方案：
      - 在 `:root` 中定义暗色主题（默认）的全部 CSS 变量
      - 使用 `[data-theme="light"]` 选择器覆盖亮色主题的变量值
      - 页面 `<html>` 初始设置 `data-theme="dark"`
      - 提供主题切换按钮（月亮/太阳图标），通过 JS 切换 `data-theme` 属性
      - 暗色/亮色分别定义背景渐变效果和网格 overlay
      - 使用 `var(--xxx)` 引用变量实现组件样式自动跟随主题

      内容结构要求：
      1. 页面头部：渐变标题 + 副标题 + 主题切换按钮
      2. 每个组件的状态行按暗色/亮色分组，用 `<h3>` + 主题徽章标注（如 `theme-badge-dk` / `theme-badge-lt`）
      3. 对话框等复合组件使用 `.dialog-demo > .dialog-overlay > .dialog-panel` 结构
      4. 响应式网格使用 CSS Grid，三断点自适应

      生成要求：
      1. 必须生成可独立运行的 HTML 文件（内联 CSS + JS，无外部依赖）
      2. 包含页面主要状态的预览：正常态、悬停态、聚焦态、加载态、空状态、错误态
      3. 覆盖桌面/平板/移动端响应式布局
      4. 所有图标使用内联 SVG（Lucide），禁止 emoji
      5. 包含基础可访问性标记（语义标签、aria-label、focus-visible、aria-busy）
      6. 文件保存到 ui-preview.html
      7. 生成后使用 preview_url 工具打开预览

      如不需要生成 UI，此 artifact 可跳过。
    requires:
      - design

  - id: tasks
    generates: tasks.md
    description: 实现任务清单，包含可追踪的任务项
    template: tasks.md
    instruction: |
      创建任务列表，拆解实现工作。

      **重要：严格遵循以下模板。** apply 阶段会解析
      checkbox 格式来追踪进度。不使用 `- [ ]` 的任务无法被追踪。

      指南：
      - 用 ## 编号标题分组相关任务
      - 每个任务必须是 checkbox：`- [ ] X.Y 任务描述`
      - 任务粒度应能在一次会话中完成
      - 按依赖顺序排列（先做什么？）

      示例：
      ```
      ## 1. 初始化

      - [ ] 1.1 创建新模块目录结构
      - [ ] 1.2 在 package.json 中添加依赖

      ## 2. 核心实现

      - [ ] 2.1 实现数据导出功能
      - [ ] 2.2 添加 CSV 格式化工具
      ```

      参考规格了解需要构建什么，参考设计了解如何构建。
      每个任务应当是可验证的——你能知道它什么时候完成。
    requires:
      - specs
      - design

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    读取上下文文件，逐步完成待处理任务，完成后标记。
    遇到阻碍或需要澄清时暂停。
